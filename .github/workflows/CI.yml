name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [ 20, 22, 24 ]
    name: Node.js ${{ matrix.node }}
    steps:
      - uses: actions/checkout@v4
      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - name: Report coverage
        if: matrix.node == 22
        run: npm run coverage
      - name: Upload coverage to Coveralls
        if: matrix.node == 22
        uses: coverallsapp/github-action@v2
        continue-on-error: true
        with:
          file: coverage/lcov.info

  package:
    name: Verify npm package
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Check package.json is valid and installable as declared
        run: npm pack --dry-run
      - name: Build the actual tarball
        run: npm pack
      - name: Upload tarball for inspection
        uses: actions/upload-artifact@v4
        with:
          name: npm-package-tarball
          path: '*.tgz'
          retention-days: 14
