name: Bump version and publish

# Releases automatically: every push to main (i.e. every merged PR) runs
# this, bumps package.json with a patch version (via the existing "version"
# npm script hook, which also regenerates CHANGELOG.md), commits + tags,
# pushes both, publishes to GitHub Packages, then creates a matching GitHub
# Release. No manual step needed for the common case.
#
# Every merge still ships as a patch release automatically - there's no
# way to intercept that push before it publishes. To also mark something
# as a minor or major release, trigger this workflow by hand afterwards -
# Actions -> Bump version and publish -> Run workflow, pick the bump type
# - which bumps again from whatever's currently published.
#
# Publishes to GitHub Packages (npm.pkg.github.com), not the public npm
# registry - this repo's package.json publishConfig points there, and
# auth uses the built-in GITHUB_TOKEN (no separate secret needed, unlike
# a real npm-registry publish which would need an NPM_TOKEN).
#
# This does the publish itself rather than relying on the separate
# publish.yml's `release: published` trigger to fire automatically: a
# release created here using the default GITHUB_TOKEN would NOT actually
# trigger that workflow (GitHub doesn't chain workflow runs off events
# produced by the default token, to prevent accidental infinite loops) -
# so publish.yml stays as a manual/standalone fallback (e.g. a human
# publishing a release by hand through the GitHub UI, or re-running a
# publish for a tag that already exists) rather than something this
# workflow depends on. That same anti-recursion behaviour is also what
# stops this workflow's own release commit (pushed with the default
# GITHUB_TOKEN) from re-triggering itself in a loop.

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version bump type'
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
        default: patch

jobs:
  bump-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history - auto-changelog needs it
      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://npm.pkg.github.com'
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      - name: Bump version, update CHANGELOG, commit and tag
        id: bump
        run: |
          BUMP_TYPE="${{ github.event.inputs.bump || 'patch' }}"
          NEW_TAG=$(npm version "$BUMP_TYPE" -m "chore: release %s")
          echo "tag=$NEW_TAG" >> "$GITHUB_OUTPUT"
      - name: Push commit and tag
        run: git push --follow-tags
      - name: Publish to GitHub Packages
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ steps.bump.outputs.tag }}" --title "${{ steps.bump.outputs.tag }}" --generate-notes
